<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--bg:#06100b;--panel:#0c1a13;--line:#17321f;--ink:#e8f3ec;--mute:#8aa595;--g:#2dff8f;--g2:#16b866;--amber:#f2b441}
*{box-sizing:border-box}

.wrap{max-width:760px;margin:auto;padding:0 16px 60px}
.top{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.logo{width:48px;height:48px;border-radius:50%;border:2px solid var(--g);background:#0c2a1b;display:grid;place-items:center}

.gl{margin-top:12px}.gl .bar{height:12px;border-radius:8px;background:#09150f;border:1px solid var(--line);overflow:hidden}.gl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));transition:width .6s}.gl .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}.gl .meta b{color:var(--ink)}.tag{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;border:1px solid var(--line);color:var(--mute)}.tag.on{color:var(--g);border-color:var(--g)}.tag.off{color:var(--amber);border-color:#6b5420}

</style></head><body><div class="wrap">
<div class="top"><div class="logo"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="7" cy="8" r="4" fill="#2dff8f"/><circle cx="23" cy="8" r="4" fill="#2dff8f"/><circle cx="15" cy="16" r="10" fill="#2dff8f"/><circle cx="11" cy="14" r="1.6" fill="#06100b"/><circle cx="19" cy="14" r="1.6" fill="#06100b"/><ellipse cx="15" cy="19" rx="3.6" ry="2.6" fill="#06100b"/></svg></div><h1>GRIZZLE <b>RADAR</b></h1><span class="live">Live</span></div>

<div id="v-radar"><div class="card hero"><h2>GRIZZLE <b>RADAR</b></h2><p>Scan the Supra NFT universe. Find trending collections, new mints, and hidden gems before they blow up.</p>
<div class="grid"><div class="stat"><span>Active NFT collections</span><b id="sCol">0</b></div><div class="stat"><span>New mints (scanned)</span><b id="sMint">0</b></div><div class="stat"><span>Unique wallets</span><b id="sWal">0</b></div><div class="stat"><span>Events (24h)</span><b id="s24">0</b></div></div></div>
<div class="card"><div class="radar" id="radar"><div class="sweep"></div></div></div></div>
<div class="card hide" id="v-wal"></div><div class="card hide" id="v-trend"></div><div class="card hide" id="v-new"></div><div class="card hide" id="v-col"></div>
<details class="card set hide"><summary>Settings</summary>
<label for="node">Supra node</label><input id="node" value="https://rpc-mainnet.supra.com">
<label for="depth">Blocks to scan per run (more = finds more NFTs, but slower)</label><input id="depth" value="600">
<label for="types">Event types (auto-filled by the radar, add more if you like)</label><textarea id="types"></textarea>
<label for="pool">Pool filter: only events containing this text (for example the Crystara contract address)</label><input id="pool" placeholder="0x...">
<label for="gfn">Grizzle live view function (Crystara contract call, leave as is unless the radar says it cannot read it)</label><input id="gfn" value="0xfd566b048d7ea241ebd4d28a3d60a9eaaaa29a718dfff52f2ff4ca8581363b85::crystara_blindbox_v1::get_lootbox_info">
<label for="from">From block height (only if auto find cannot read the latest block)</label><input id="from" placeholder="optional">
<div class="row"><button class="b" id="go">Scan now</button><button class="b o" id="deep">Deep scan (5x blocks)</button><button class="b o" id="auto">Auto refresh: off</button></div></details>
<div id="status" class="msg">Starting auto scan...</div><div id="log" class="msg"></div>
</div><script>

const $=id=>document.getElementById(id);
const PIN={name:'GRIZZLE JUNKYARD DEFENDERS',addr:'0x9d84e90877801d4680ea1f771314244ef585d0ab17bbb74dc18bdda804e02d26',supply:222,url:'https://crystara.trade/marketplace/grizzlejunkyarddefenders',img:'https://cdn2.crystara.trade/collections/0x9d84e90877801d4680ea1f771314244ef585d0ab17bbb74dc18bdda804e02d26-GRIZZLE%20JUNKYARD%20DEFENDERS/banner.jpg'};
const events=new Map(); // key -> event
let timer=null,busy=false;

const sh=s=>/^0x[0-9a-fA-F]{12,}$/.test(String(s))?`<span title="${esc(s)}">${esc(String(s).slice(0,8))}…${esc(String(s).slice(-4))}</span>`:esc(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pick(o,names){
  if(!o||typeof o!=='object')return '';
  for(const k of Object.keys(o)){
    if(names.some(n=>k.toLowerCase().includes(n))){const v=o[k];if(typeof v==='string')return v;if(v&&typeof v==='object'){const i=v.inner||v.address||v.name;if(typeof i==='string')return i}}
  }
  for(const k of Object.keys(o)){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])){const r=pick(o[k],names);if(r)return r}}
  return '';
}
function norm(raw,type){
  const ev=raw.event||raw; const d=ev.data||ev;
  const ts=raw.timestamp||raw.block_timestamp||ev.timestamp||'';
  return {type:ev.type||type,data:d,height:raw.block_height||raw.height||'',tx:raw.transaction_hash||raw.tx_hash||raw.hash||'',
    ts:ts?(ts>1e14?ts/1000:ts>1e11?ts:ts*1000):0,
    col:pick(d,['collection']),tok:pick(d,['token','nft']),who:pick(d,['creator','owner','to','minter','buyer'])};
}
// one key per event, so the same event found by the block reader and the type scan is counted once
function addEv(e){
  const k=e.type+'|'+JSON.stringify(e.data);
  const o=events.get(k);
  if(!o){events.set(k,e);return 1}
  if(!o.ts&&e.ts)o.ts=e.ts;if(!o.tx&&e.tx)o.tx=e.tx;if(!o.height&&e.height)o.height=e.height;
  return 0;
}
async function fetchType(base,type,q,max=500){
  const out=[];let cursor='';
  while(out.length<max){
    const u=`${base}/rpc/v3/events/${encodeURIComponent(type)}?limit=100${q}${cursor?'&start='+encodeURIComponent(cursor):''}`;
    const r=await fetch(u,{headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error(`${type}: HTTP ${r.status}`);
    const j=await r.json();const arr=Array.isArray(j)?j:(j.data||j.events||[]);
    out.push(...arr.map(x=>norm(x,type)));
    cursor=r.headers.get('X_SUPRA_CURSOR')||r.headers.get('x-supra-cursor')||'';
    if(!cursor||!arr.length)break;
  }
  return out;
}
async function scan(){
  const base=$('node').value.replace(/\/$/,'');
  const types=$('types').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const from=$('from').value.trim();const q=from?`&start_height=${encodeURIComponent(from)}`:'';
  $('status').className='msg';$('status').textContent='Scanning event types...';
  let fresh=0;const errs=[];
  await pmap(types,4,async t=>{
    try{for(const e of await fetchType(base,t,q))fresh+=addEv(e)}catch(x){errs.push(x.message)}
  });
  render(fresh);
  if(errs.length){$('status').className='msg err';$('status').textContent='Some types failed: '+errs.slice(0,3).join('; ')+(errs.length>3?' ...':'')+'. Check the type names, or the browser may be blocking the request (CORS).'}
  else $('status').textContent='Done at '+new Date().toLocaleTimeString()+'.';
}
function groups(){
  const g=new Map();
  for(const e of events.values()){const k=e.col||e.tok||'(unknown)';
    if(!g.has(k))g.set(k,{k,n:0,last:0,who:new Set(),ev:e});
    const o=g.get(k);o.n++;o.last=Math.max(o.last,e.ts);if(e.who)o.who.add(e.who)}
  return [...g.values()];
}
function raw(e){return `<details><summary>raw</summary><pre>${esc(JSON.stringify(e.data,null,1))}</pre></details>`}

// run fn over items with a limited number of requests at the same time
async function pmap(items,n,fn){
  const res=[];let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;res[k]=await fn(items[k],k)}}));
  return res;
}
// wallet helpers: compare addresses ignoring case and leading zeros
const nA=s=>{s=String(s||'').trim().toLowerCase();return /^0x[0-9a-f]+$/.test(s)?'0x'+(s.slice(2).replace(/^0+/,'')||'0'):s};
function addrs(e){
  if(e._a)return e._a;const s=new Set();
  (function f(x){if(typeof x==='string'){if(/^0x[0-9a-f]+$/i.test(x))s.add(nA(x))}else if(x&&typeof x==='object')for(const k in x)f(x[k])})(e.data);
  return e._a=s;
}

let lastH=0,blockIdx=-1;
const NFT_RE=/collection|nft|::token::|mint/i,SKIP_RE=/coin|fungible|gas|fee|stake|reward/i;
function log(m){$('log').textContent=m}
async function getJ(u){const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function walk(o,cb){if(Array.isArray(o))o.forEach(x=>walk(x,cb));else if(o&&typeof o==='object'){if(typeof o.type==='string'&&o.type.includes('::')&&o.data&&typeof o.data==='object')cb(o);for(const k in o)walk(o[k],cb)}}
function findH(o){let h=0;(function f(x){if(h||!x||typeof x!=='object')return;for(const k in x){if(/^(block_)?height$/i.test(k)&&Number(x[k])>0){h=Number(x[k]);return}}for(const k in x)f(x[k])})(o);return h}
function findTs(o){let t=0;(function f(x){if(t||!x||typeof x!=='object')return;for(const k in x){if(/^(block_)?timestamp$/i.test(k)&&Number(x[k])>0){t=Number(x[k]);return}}for(const k in x)f(x[k])})(o);return t}
async function latest(base){
  for(const u of ['/rpc/v3/block','/rpc/v1/block','/rpc/v2/block','/rpc/v1/consensus/latest_block','/rpc/v1/consensus/block'])
    try{const h=findH(await getJ(base+u));if(h)return h}catch(e){}
  return 0}
async function getBlock(base,h){
  const T=[h=>`${base}/rpc/v3/block/height/${h}?with_finalized_transactions=true`,h=>`${base}/rpc/v1/block/height/${h}?with_finalized_transactions=true`,h=>`${base}/rpc/v3/block/height/${h}`,h=>`${base}/rpc/v2/block/height/${h}?with_finalized_transactions=true`,h=>`${base}/rpc/v1/consensus/block/height/${h}?with_batches=true`];
  if(blockIdx>=0)return getJ(T[blockIdx](h));
  for(let i=0;i<T.length;i++){try{const j=await getJ(T[i](h));blockIdx=i;return j}catch(e){window._be=e.message}}
  throw new Error('no block endpoint: '+(window._be||'?'));
}
async function discover(deep){
  const base=$('node').value.replace(/\/$/,'');
  let top=await latest(base);const manual=Number($('from').value);
  const depth=Math.max(20,Number($('depth').value)||300)*(deep?5:1);
  if(!top&&!manual){log('Could not find the latest block height. Type a recent block height in "From block height" (see SupraScan) and press Scan now.');return 0}
  if(!top)top=manual+depth;
  let start=(lastH&&!deep)?lastH+1:Math.max(1,top-depth);
  if(manual&&!lastH&&!deep)start=manual;
  start=Math.max(start,top-depth*2);
  const hs=[];for(let h=start;h<=top;h++)hs.push(h);
  let found=0,got=0,done=0;const types=new Set();
  try{await getBlock(base,top)}catch(e){} // detect which block endpoint works before going parallel
  await pmap(hs,10,async h=>{
    let j=null;
    for(let t=0;t<2&&!j;t++){try{j=await getBlock(base,h)}catch(e){}}
    done++;if(done%25===0)log(`Auto find: reading blocks ${done}/${hs.length}...`);
    if(!j)return;got++;
    const bts=findTs(j);
    walk(j,ev=>{if(NFT_RE.test(ev.type)&&!SKIP_RE.test(ev.type)){types.add(ev.type);found+=addEv(norm({event:ev,block_height:h,timestamp:bts},ev.type))}});
  });
  lastH=Math.max(lastH,top);
  const ta=$('types');const have=new Set(ta.value.split('\n').map(x=>x.trim()));
  for(const t of types)if(!have.has(t))ta.value+=(ta.value.endsWith('\n')||!ta.value?'':'\n')+t;
  log(`Auto find: read ${got}/${hs.length} blocks (${start}-${top}), ${found} new NFT-like events, ${types.size} event types${got?'':' (block endpoint did not answer: '+(window._be||'blocked/CORS?')+')'}.`);
  return found}
async function auto(deep){
  if(busy)return;busy=true;
  try{liveGrizzle().then(()=>render(0));await discover(deep===true);await scan()}
  catch(e){$('status').className='msg err';$('status').textContent='Scan error: '+e.message}
  finally{busy=false}
}

// ---- Grizzle live stats (minted / supply / price) straight from the Supra node ----
let GL=null,GLerr='';
const GL_NAME='GRIZZLE JUNKYARD DEFENDERS';
const hexName=s=>'0x'+[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
function findKey(o,re){let r;(function f(x){if(r!==undefined||!x||typeof x!=='object')return;for(const k in x){if(re.test(k)&&x[k]!==null&&typeof x[k]!=='object'){r=x[k];return}}for(const k in x)f(x[k])})(o);return r}
function parseLive(j){
  const root=Array.isArray(j.result)?j.result:(j.result||j);
  let o=root;
  // view results may come as an array of values or a JSON string
  const flat=[];(function f(x){if(typeof x==='string'){try{const p=JSON.parse(x);if(p&&typeof p==='object')return f(p)}catch(e){}flat.push(x)}else if(x&&typeof x==='object')Object.values(x).forEach(f);else flat.push(x)})(root);
  const price=findKey(o,/^price$/i),max=findKey(o,/^max_?supply$/i),rolled=findKey(o,/^(rolled|minted|total_?minted)$/i),stock=findKey(o,/^stock$/i),act=findKey(o,/^is_?active$/i);
  if(max===undefined&&rolled===undefined&&price===undefined)return null;
  const N=v=>v===undefined?undefined:Number(v);
  const maxN=N(max)||PIN.supply;
  let minted=N(rolled);if(minted===undefined&&N(stock)!==undefined)minted=maxN-N(stock);
  let pr=N(price);if(pr!==undefined&&pr>=1e8)pr=pr/1e8; // octas -> SUPRA
  return {minted,max:maxN,price:pr,active:act===undefined?undefined:(act===true||act==='true')};
}
let GLok=null,GLfns='';
async function viewCall(base,ep,f,args){
  const r=await fetch(base+ep,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({function:f,type_arguments:[],arguments:args})});
  const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
  if(!r.ok)throw new Error(f.split('::').pop()+' '+r.status+' '+t.replace(/\s+/g,' ').slice(0,90));
  const p=parseLive(j);if(!p)throw new Error(f.split('::').pop()+' no stats in result');
  return p;
}
// read the contract's own function list so we do not have to guess names
async function abiFns(base,addr,mod){
  for(const ep of [`/rpc/v3/accounts/${addr}/modules/${mod}`,`/rpc/v1/accounts/${addr}/modules/${mod}`,`/rpc/v2/accounts/${addr}/modules/${mod}`]){
    try{const j=await getJ(base+ep);const abi=j.abi||(j.result&&j.result.abi)||j;if(abi&&abi.exposed_functions)return abi.exposed_functions}catch(e){}
  }
  return [];
}
function argFor(t,i){
  t=String(t);
  if(/signer/.test(t))return null;
  if(t==='address')return i===0?PIN.addr:'0x0';
  if(/String$/.test(t))return GL_NAME;
  if(/^vector<u8>$/.test(t))return hexName(GL_NAME);
  return undefined; // unknown type, skip this function
}
async function liveGrizzle(){
  const base=$('node').value.replace(/\/$/,'');
  const errs=[];
  if(GLok){try{GL=Object.assign(await viewCall(base,GLok.ep,GLok.f,GLok.a),{at:Date.now(),src:GLok.f.split('::').pop()});GLerr='';return true}catch(e){GLok=null}}
  const fn=$('gfn').value.trim(),[addr,mod]=fn.split('::');
  const tries=[];
  for(const f of [fn,fn.replace(/::[^:]+$/,'::get_lootbox')])for(const a of [[PIN.addr,GL_NAME,'0x0'],[PIN.addr,GL_NAME],[PIN.addr,hexName(GL_NAME)]])tries.push([f,a]);
  // functions from the contract ABI
  const fs=await abiFns(base,addr,mod);
  if(fs.length){
    GLfns=fs.map(f=>f.name+'('+(f.params||[]).filter(x=>!/signer/.test(x)).length+')').slice(0,25).join(', ');
    for(const f of fs){
      if(!/lootbox|info|stat|get|collection|supply|price|rolled/i.test(f.name))continue;
      if((f.params||[]).some(x=>/signer/.test(x)))continue;
      const a=(f.params||[]).map(argFor);if(a.includes(undefined))continue;
      tries.push([`${addr}::${mod}::${f.name}`,a]);
    }
  }
  for(const [f,a] of tries)for(const ep of ['/rpc/v3/view','/rpc/v1/view']){
    try{const p=await viewCall(base,ep,f,a);GL=Object.assign(p,{at:Date.now(),src:f.split('::').pop()});GLok={ep,f,a};GLerr='';return true}
    catch(e){if(errs.length<4)errs.push(e.message)}
  }
  GLerr=[...new Set(errs)].slice(0,3).join(' | ')+(GLfns?' | contract functions: '+GLfns:' | could not read contract ABI');return false;
}
function liveHtml(){
  if(!GL)return `<div class="gl"><span class="tag off">Live: not connected</span><div class="msg err">${esc(GLerr||'Loading...')} — the radar still counts mints from chain events below.</div></div>`;
  const m=GL.minted===undefined?0:GL.minted,pct=Math.min(100,Math.round(m/GL.max*1000)/10);
  return `<div class="gl"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag on">Live</span>${GL.active===undefined?'':`<span class="tag ${GL.active?'on':'off'}">${GL.active?'Mint open':'Mint closed'}</span>`}${m>=GL.max?'<span class="tag off">SOLD OUT</span>':''}</div>
  <div class="grid"><div class="stat"><span>Minted</span><b>${m} / ${GL.max}</b></div><div class="stat"><span>Mint price</span><b style="font-size:22px">${GL.price===undefined?'-':GL.price.toLocaleString(undefined,{maximumFractionDigits:2})+' SUPRA'}</b></div></div>
  <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div><div class="meta"><span><b>${pct}%</b> minted</span><span><b>${Math.max(0,GL.max-m)}</b> left</span><span>${new Date(GL.at).toLocaleTimeString()}</span></div></div>`;
}


function thumb(e,k){
  const d=(e&&e.data)||{};k=String(k);
  const creator=pick(d,['creator']),name=pick(d,['collection_name','collection']);
  let u='';
  if(nA(k)===nA(PIN.addr)||/grizzle junkyard/i.test(k+' '+name))u=PIN.img;
  else if(/^0x[0-9a-f]{20,}$/i.test(creator||'')&&name&&!/^0x[0-9a-f]{20,}$/i.test(name))u=`https://cdn2.crystara.trade/collections/${creator}-${encodeURIComponent(name)}/banner.jpg`;
  return `<span class="th" style="background:hsl(${hue(k)},70%,60%)">${esc(k.replace(/^0x/,'').slice(0,2).toUpperCase())}${u?`<img src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.remove()">`:''}</span>`;
}
function hue(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))%360;return h}
function render(fresh){
  const q=$('q').value.trim().toLowerCase(),all=[...events.values()],now=Date.now();
  const gs=groups().filter(g=>!q||g.k.toLowerCase().includes(q));
  const mints=all.filter(e=>/mint/i.test(e.type));
  $('sCol').textContent=groups().length;$('sMint').textContent=mints.length;
  $('sWal').textContent=new Set(all.map(e=>e.who).filter(Boolean)).size;
  const hasTs=all.some(e=>e.ts);$('s24').textContent=hasTs?all.filter(e=>e.ts>now-864e5).length:all.length;
  const top=[...gs].sort((a,b)=>b.n-a.n).slice(0,16),mx=Math.max(1,...top.map(g=>g.n));
  // spread dots with the golden angle so they do not pile on top of each other
  $('radar').innerHTML='<div class="sweep"></div>'+top.map((g,i)=>{const a=(i*137.5)*Math.PI/180,r=14+(1-g.n/mx)*28;
    return `<div class="dot" title="${esc(g.k)} (${g.n} events)" style="left:${50+r*Math.cos(a)}%;top:${50+r*Math.sin(a)}%;background:hsl(${hue(g.k)},70%,60%)">${esc(g.k.replace(/^0x/,'').slice(0,2).toUpperCase())}</div>`}).join('');
  const t=(h,r)=>r.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table>`:'<div class="msg">Nothing here yet. The radar fills up as it scans.</div>';
  $('v-col').innerHTML=t(['Collection / token','Events','Wallets','Latest'],gs.sort((a,b)=>b.last-a.last).map(g=>`<tr><td>${thumb(g.ev,g.k)}${sh(g.k)}${raw(g.ev)}</td><td>${g.n}</td><td>${g.who.size}</td><td>${g.last?new Date(g.last).toLocaleString():'-'}</td></tr>`));
  const W=[['1h',36e5],['24h',864e5],['7d',6048e5]];
  const rows=gs.map(g=>{const r={k:g.k,all:g.n,ev:g.ev};for(const[n,ms]of W)r[n]=all.filter(e=>(e.col||e.tok||'(unknown)')===g.k&&e.ts>now-ms).length;return r})
    .sort((a,b)=>hasTs?(b['24h']-a['24h']||b['1h']-a['1h']||b.all-a.all):b.all-a.all);
  $('v-trend').innerHTML=(hasTs?'':'<div class="msg">No timestamps in events, ranking by total count.</div>')+t(['Collection / token','1h','24h','7d','Total'],rows.slice(0,30).map(r=>`<tr><td>${thumb(r.ev,r.k)}${sh(r.k)}</td><td>${r['1h']}</td><td>${r['24h']}</td><td>${r['7d']}</td><td>${r.all}</td></tr>`));
  const ev=(l)=>l.sort((a,b)=>b.ts-a.ts).slice(0,100).map(e=>`<tr><td>${e.ts?new Date(e.ts).toLocaleString():'#'+esc(e.height)}</td><td>${esc(e.type)}</td><td>${thumb(e,e.col||e.tok||'-')}${sh(e.col||e.tok||'-')}${raw(e)}</td><td>${sh(e.who||'-')}</td></tr>`);
  const qf=e=>!q||JSON.stringify(e.data).toLowerCase().includes(q)||e.type.toLowerCase().includes(q);
  $('v-new').innerHTML=t(['When','Type','Collection / token','Wallet'],ev(mints.filter(qf)));
  // pinned Grizzle collection, always on top
  const pn=PIN.name.toLowerCase(),pa=nA(PIN.addr);
  const pe=all.filter(e=>addrs(e).has(pa)||JSON.stringify(e.data).toLowerCase().includes(pn));
  const pm=pe.filter(e=>/mint/i.test(e.type)),pl=Math.max(0,...pe.map(e=>e.ts));
  $('pin').innerHTML=`<div class="ph"><img src="${PIN.img}" alt="" onerror="this.style.display='none'"><div><h3>${esc(PIN.name)} <b>• ${PIN.supply} supply</b></h3><a href="${PIN.url}" target="_blank" rel="noopener">View on Crystara</a></div></div>
  ${liveHtml()}<div class="grid"><div class="stat"><span>Events (scanned)</span><b>${pe.length}</b></div><div class="stat"><span>Mints</span><b>${pm.length}</b></div><div class="stat"><span>Wallets</span><b>${new Set(pe.map(e=>e.who).filter(Boolean)).size}</b></div><div class="stat"><span>Last activity</span><b style="font-size:14px">${pl?new Date(pl).toLocaleString():'-'}</b></div></div>`;
  // wallet tab
  const wv=$('wal').value.trim();
  if(!wv){$('v-wal').innerHTML='<div class="msg">Paste a wallet address in the box at the top to see every NFT event it appears in.</div>'}
  else{
    const WA=nA(wv),mine=all.filter(e=>addrs(e).has(WA)&&qf(e));
    const cols=new Set(mine.map(e=>e.col||e.tok).filter(Boolean));
    $('v-wal').innerHTML=`<div class="msg">Wallet: ${esc(wv)}</div><div class="grid"><div class="stat"><span>Events for this wallet</span><b>${mine.length}</b></div><div class="stat"><span>Collections / tokens</span><b>${cols.size}</b></div></div>`
      +(mine.length?`<div style="margin-top:14px">${t(['When','Type','Collection / token','Wallet'],ev(mine))}</div>`
        :'<div class="msg">Nothing for this wallet in the scanned blocks yet. Press "Deep scan (5x blocks)" in Settings to look further back.</div>');
  }
}
function showTab(id){
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===id));
  for(const i of['radar','wal','trend','new','col'])$('v-'+i).classList.toggle('hide',id!==i);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('go').onclick=()=>auto(false);$('deep').onclick=()=>auto(true);
$('q').oninput=()=>render(0);
function setWallet(v,save){
  v=v.trim();
  if(!/^0x[0-9a-f]{20,}$/i.test(v))return false;
  if(save)try{localStorage.setItem('grizzleWallet',v)}catch(e){}
  $('wal').value=v;$('walShort').textContent=v.slice(0,8)+'…'+v.slice(-4);$('walShort').title=v;
  $('walBox').classList.add('hide');$('walChip').classList.remove('hide');render(0);return true;
}
$('wal').oninput=()=>setWallet($('wal').value,true);
$('walChange').onclick=()=>{
  try{localStorage.removeItem('grizzleWallet')}catch(e){}
  $('wal').value='';$('walChip').classList.add('hide');$('walBox').classList.remove('hide');$('wal').focus();render(0);
};
try{const w=localStorage.getItem('grizzleWallet');if(w)setWallet(w,false)}catch(e){}
$('auto').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;$('auto').textContent='Auto refresh: off'}
  else{timer=setInterval(()=>auto(false),30000);$('auto').textContent='Auto refresh: 30s';auto(false)}
};
$('auto').click();
</script></body></html>
